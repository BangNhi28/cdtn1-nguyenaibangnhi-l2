
services:
  app:
    build: .
    container_name: smartcrm-l2
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: 3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45

